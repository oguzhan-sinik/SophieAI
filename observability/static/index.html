<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freya Builder Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#2d333b;--text:#e6edf3;
  --dim:#8b949e;--accent:#58a6ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--unk:#6e7681;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:14px;margin:0 8px 0 0;color:var(--accent);white-space:nowrap}
select,input[type=search]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font:inherit}
.meta{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;border:1px solid var(--border);background:var(--panel2)}
.b-ok{color:var(--ok);border-color:var(--ok)} .b-bad{color:var(--bad);border-color:var(--bad)}
.b-warn{color:var(--warn);border-color:var(--warn)} .b-unk{color:var(--unk)}
.b-champ{color:#b392f0;border-color:#b392f0;font-weight:600}
#live{cursor:pointer} #live.on{color:var(--ok)} #live.off{color:var(--bad)}
main{flex:1;display:flex;min-height:0}
.pane{background:var(--panel);overflow:auto;min-width:120px}
#left{width:22%;border-right:1px solid var(--border)}
#center{flex:1;background:var(--bg);border-right:1px solid var(--border)}
#right{width:30%;position:relative;display:flex;flex-direction:column}
.pane h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.stickytools{position:sticky;top:0;background:var(--panel);z-index:3;padding:6px 8px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}
.row{padding:5px 10px;border-bottom:1px solid #21262d;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.row:hover{background:var(--panel2)}
.row.sel{background:#1f3a5f;outline:1px solid var(--accent)}
.row .t{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:3px}
.dot.succeeded{background:var(--ok)} .dot.failed{background:var(--bad)} .dot.running,.dot.interrupted{background:var(--warn)}
.dot.warning{background:var(--warn)} .dot.unknown{background:var(--unk)}
#center .wrap{padding:14px 18px;max-width:1100px}
.crumbs{color:var(--dim);font-size:12px;margin-bottom:8px;font-family:var(--mono)}
.crumbs b{color:var(--text)}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:18px 0 6px;border-bottom:1px solid var(--border);padding-bottom:3px}
table.kv{border-collapse:collapse;font-size:12px}
table.kv td{padding:2px 12px 2px 0;vertical-align:top}
table.kv td:first-child{color:var(--dim);white-space:nowrap}
pre.code{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:var(--mono);font-size:11.5px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
.errbox{background:#2d1214;border:1px solid var(--bad);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:12px;color:#ffb3ad;margin:6px 0;white-space:pre-wrap}
.warnbox{background:#2a2108;border:1px solid var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin:6px 0;white-space:pre-wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--dim);padding:6px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tabs button.act{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
button.ctl{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 9px;cursor:pointer;font:inherit;font-size:12px}
button.ctl:hover{border-color:var(--accent)}
#svgwrap{flex:1;min-height:0;overflow:hidden;cursor:grab}
#treeSvg{width:100%;height:100%;display:block}
#graphTools{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:5}
#warnCount{position:absolute;bottom:8px;left:8px;z-index:5;font-size:11px;color:var(--warn)}
.gnode{cursor:pointer}
.gnode rect{fill:var(--panel2);stroke:var(--border);rx:5}
.gnode.sel rect{stroke:var(--accent);stroke-width:2}
.gnode.champ rect{stroke:#b392f0;stroke-width:2}
.gnode.invalid rect{stroke:var(--bad)}
.gnode text{fill:var(--text);font-family:var(--mono);font-size:11px;pointer-events:none}
.gnode .ttl{font-size:12.5px;font-weight:600;font-family:inherit}
.gnode .badtxt{fill:#ff938a} .gnode .oktxt{fill:var(--ok)} .gnode .hi{fill:var(--text)}
.gnode .bar{fill:#30363d;stroke:none} .gnode .barfill{fill:var(--ok);stroke:none}
.glabel{fill:var(--accent);font-family:var(--mono);font-size:10.5px}
.gnode .sub{fill:var(--dim);font-size:10px}
.gedge{stroke:#444c56;fill:none;stroke-width:1.4}
.empty{color:var(--dim);padding:24px;text-align:center}
#wfwrap{height:460px;border:1px solid var(--border);border-radius:6px;background:var(--panel);overflow:hidden;cursor:grab;position:relative}
#wfSvg{width:100%;height:100%;display:block}
.wfbar{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.wfbar .lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--dim);margin-left:6px}
.wfbar .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.wn{cursor:pointer}
.wn rect{fill:var(--panel2);stroke-width:1.5}
.wn text{fill:var(--text);font-family:var(--mono);font-size:11px;pointer-events:none}
.wn .sub{fill:var(--dim);font-size:9.5px}
.wn.dimmed{opacity:.28}
.wn.sel rect{stroke-width:3;fill:#1f3a5f}
.wn.flag rect{stroke:var(--bad);stroke-dasharray:4 2}
.wn.dchg rect:first-of-type{fill:#3a2f0b;stroke:var(--warn);stroke-width:2.5}
.wn.dadd rect:first-of-type{fill:#10301a;stroke:var(--ok);stroke-width:2.5}
.we{stroke:#57606a;fill:none;stroke-width:1.2}
.we.fb{stroke-dasharray:5 4}
.we.back{stroke:#3d444d}
.we.hot{stroke:var(--accent);stroke-width:2}
.we.dimmed{opacity:.12}
.wl{fill:var(--accent);font-family:var(--mono);font-size:9.5px;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.cases{border-collapse:collapse;width:100%;font-size:12px}
.cases td{padding:5px 8px 5px 0;vertical-align:top;border-top:1px solid #21262d}
.cases tr.case{cursor:pointer} .cases tr.case:hover td{background:var(--panel)}
.cases .why{color:#ffb3ad;font-size:11.5px;white-space:pre-wrap;margin:2px 0}
.scorebar{display:flex;height:10px;border-radius:5px;overflow:hidden;border:1px solid var(--border);margin:6px 0 10px;max-width:420px}
.scorebar i{display:block;height:100%} .scorebar .p{background:var(--ok)} .scorebar .f{background:var(--bad)}
.talk{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:10px;max-height:520px;overflow:auto}
.talk .who{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.talk .b{margin:5px 0;padding:6px 9px;border-radius:8px;max-width:82%;white-space:pre-wrap;font-size:12.5px}
.talk .agent{background:#172a45;border:1px solid #23406b}
.talk .cust{background:#22272e;border:1px solid var(--border);margin-left:auto}
.talk .sys{font-family:var(--mono);font-size:11px;color:var(--dim);margin:3px 0;white-space:pre-wrap;word-break:break-word}
.talk .sys.tool{color:var(--warn)} .talk .sys.bad{color:var(--bad)} .talk .sys.ok{color:var(--ok)}
.kids{font-family:var(--mono);font-size:11px;color:var(--dim);max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--panel)}
.row .cnt{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:0 5px}
details.fold{border:1px solid var(--border);border-radius:6px;margin:5px 0;background:var(--panel)}
details.fold>summary{cursor:pointer;padding:6px 10px;font-size:12.5px}
details.fold>*:not(summary){margin:0 10px 8px}
details.fold details.fold{background:var(--bg)}
.say{font-size:12.5px;border-left:2px solid var(--border);padding-left:8px}
.ncard{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:10px;background:var(--panel)}
.ncard h4{margin:0 0 6px;font-size:13px;font-family:var(--mono)}
.ncard .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 3px}
.ncard .say{white-space:pre-wrap;font-size:12.5px;border-left:2px solid var(--border);padding-left:8px}
.ncard table{border-collapse:collapse;font-size:12px;width:100%}
.ncard td{padding:3px 10px 3px 0;vertical-align:top;border-top:1px solid #21262d}
.ncard a{color:var(--accent);cursor:pointer;font-family:var(--mono)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;margin:1px 3px 1px 0}
.mono{font-family:var(--mono)}
.score-pill{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.diffadd{color:var(--ok)} .diffrem{color:var(--bad)}
::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px}
@media (max-width:1100px){#left{width:28%}#right{width:34%}}
</style>
</head>
<body>
<header>
  <h1>Freya Builder Studio</h1>
  <select id="runPicker" title="Run history"></select>
  <span id="hdrStatus" class="badge b-unk">—</span>
  <span class="meta" id="hdrMeta"></span>
  <span class="meta" id="hdrChampion"></span>
  <span style="flex:1"></span>
  <span id="live" class="badge off" title="Toggle live follow (L)">● live</span>
  <span class="meta" id="hdrUpdated"></span>
</header>
<main>
  <div class="pane" id="left">
    <h2>Traces</h2>
    <div class="stickytools"><input type="search" id="traceSearch" placeholder="/ filter (agent, call, error)…"></div>
    <div id="traceList"><div class="empty">No run selected</div></div>
  </div>
  <div class="pane" id="center"><div class="wrap" id="inspector"><div class="empty">Select a trace or a tree node</div></div></div>
  <div class="pane" id="right">
    <h2>Evolution lineage — all candidates</h2>
    <div id="svgwrap"><svg id="treeSvg"></svg></div>
    <div id="graphTools">
      <button class="ctl" id="btnFit" title="Fit all (F)">Fit</button>
      <button class="ctl" id="btnAll" title="Show entire tree">Show all</button>
    </div>
    <div id="warnCount"></div>
  </div>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=(p)=>fetch("/api/"+p).then(r=>r.json().then(j=>({ok:r.ok,status:r.status,body:j})));
const fmtTime=t=>t?new Date(t).toLocaleTimeString():"—";
const dur=ms=>ms==null?"":(ms<1000?ms+"ms":(ms/1000).toFixed(1)+"s");

/* ---------- state (single shared selection; per-run view cache) ---------- */
const S={
  runs:[], runId:null, epoch:0, live:true, es:null,
  tree:null, spans:null, summary:null,
  sel:{kind:"none"},            // {kind:'span'|'candidate'|'run', id?}
  traceQ:"", expanded:new Set(),
  perRun:{}                      // runId -> {sel, traceQ}
};
function saveViewState(){ if(S.runId) S.perRun[S.runId]={sel:S.sel,traceQ:S.traceQ}; }
function restoreViewState(){
  const v=S.perRun[S.runId]||{};
  S.sel=v.sel||{kind:"run"}; S.traceQ=v.traceQ||"";
  $("#traceSearch").value=S.traceQ;
}

/* ---------- deep links ---------- */
function pushLink(){
  let h="#/runs/"+(S.runId||"");
  if(S.sel.kind==="candidate") h+="?candidate="+encodeURIComponent(S.sel.id);
  if(S.sel.kind==="span") h+="?span="+encodeURIComponent(S.sel.id);
  history.replaceState(null,"",h);
}
function parseLink(){
  const m=location.hash.match(/^#\/runs\/([^?]+)/);
  if(!m) return null;
  const q=new URLSearchParams(location.hash.split("?")[1]||"");
  if(q.get("candidate")) return{runId:m[1],sel:{kind:"candidate",id:q.get("candidate")}};
  if(q.get("span")) return{runId:m[1],sel:{kind:"span",id:q.get("span")}};
  return{runId:m[1],sel:{kind:"run"}};
}

/* ---------- data loading ---------- */
async function loadRuns(){
  const r=await api("runs"); S.runs=r.body.items||[];
  const pk=$("#runPicker");
  pk.innerHTML=S.runs.map(r=>{
    const s=r.status||"unknown";
    return `<option value="${esc(r.run_id)}">${esc(r.run_id)} · ${esc(s)}${r.final_score!=null?" · "+r.final_score:""}</option>`;
  }).join("");
}
async function selectRun(runId, sel){
  if(!runId) {renderEmpty(); return;}
  saveViewState(); S.epoch++; const ep=S.epoch;
  if(S.es){S.es.close(); S.es=null;}
  S.runId=runId; restoreViewState(); if(sel) S.sel=sel;
  $("#runPicker").value=runId;
  const [summ,tree,spans]=await Promise.all([
    api("runs/"+runId), api("runs/"+runId+"/tree"), api("runs/"+runId+"/spans")]);
  if(ep!==S.epoch) return; // stale response from previous run — drop
  S.summary=summ.body; S.tree=tree.body; S.spans=spans.body;
  renderHeader(); renderTraces(); renderTree(); renderInspector();
  connectSSE(); pushLink();
}
function connectSSE(){
  if(S.es) S.es.close();
  if(!S.runId) return;
  const ep=S.epoch;
  const es=new EventSource("/api/runs/"+encodeURIComponent(S.runId)+"/stream");
  S.es=es;
  es.addEventListener("snapshot",()=>setLive(true));
  es.addEventListener("changed",async()=>{
    setLive(true);
    if(!S.live) return;                       // paused: buffer ignored, next toggle refetches
    const [tree,spans,summ]=await Promise.all([
      api("runs/"+S.runId+"/tree"), api("runs/"+S.runId+"/spans"), api("runs/"+S.runId)]);
    if(ep!==S.epoch) return;
    S.tree=tree.body; S.spans=spans.body; S.summary=summ.body;
    renderHeader(); renderTraces(); renderTree(); refreshInspectorIfVisible();
    $("#hdrUpdated").textContent="updated "+fmtTime(new Date().toISOString());
  });
  es.onerror=()=>setLive(false);
}
function setLive(on){
  const el=$("#live"); el.classList.toggle("on",on); el.classList.toggle("off",!on);
  el.textContent=on?"● live":"○ reconnecting";
}
$("#live").onclick=()=>{S.live=!S.live; if(S.live) refreshAll();};
function refreshAll(){ if(S.runId) selectRun(S.runId); }

/* ---------- header ---------- */
function renderHeader(){
  const s=S.summary||{};
  const st=$("#hdrStatus");
  st.textContent=s.status||"unknown";
  st.className="badge "+(s.status==="succeeded"||s.status==="completed"?"b-ok":s.status==="failed"?"b-bad":s.status==="interrupted"?"b-warn":"b-unk");
  $("#hdrMeta").textContent=[s.mode,s.duration_seconds!=null?Math.round(s.duration_seconds)+"s":null,
    s.candidate_count!=null?s.candidate_count+" candidates":null,
    (s.builder_model||"").split("/").pop()].filter(Boolean).join(" · ");
  $("#hdrChampion").textContent=s.champion_candidate_id?("champion "+s.champion_candidate_id+(s.final_score!=null?" · score "+s.final_score+" ("+(s.evaluation_type||"")+")":"")):"";
  if(S.tree&&S.tree.warnings.length) $("#hdrChampion").textContent+=" ⚠ "+S.tree.warnings.length+" integrity warnings";
}

/* ---------- left: traces ---------- */
function statusDot(st){return `<span class="dot ${esc(st||"unknown")}"></span>`;}
function renderTraces(){
  const q=S.traceQ.toLowerCase();
  const spans=(S.spans?.spans||[]);
  const match=sp=>!q||JSON.stringify([sp.name,sp.kind,sp.call_id,sp.error,sp.model,sp.purpose,sp.status]).toLowerCase().includes(q);
  const list=spans.filter(match);
  $("#traceList").innerHTML=list.length?list.map(sp=>{
    const sel=S.sel.kind==="span"&&S.sel.id===sp.span_id?" sel":"";
    return `<div class="row${sel}" data-span="${esc(sp.span_id)}">
      ${statusDot(sp.status)}
      <span class="t">${esc((sp.start_at||"").slice(11,19))}</span>
      <span class="nm" title="${esc(sp.error||sp.purpose||"")}">${esc(sp.name)}</span>
      ${sp.children&&sp.children.length?`<span class="cnt" title="platform calls grouped in this trace">${sp.children.length}</span>`:""}
      <span class="t">${esc(dur(sp.duration_ms))}</span></div>`;
  }).join(""):`<div class="empty">${spans.length?"No trace matches filter":"No recorded trace events"}</div>`;
  $("#traceList").querySelectorAll("[data-span]").forEach(el=>
    el.onclick=()=>{S.sel={kind:"span",id:el.dataset.span};renderTraces();renderTree();renderInspector();pushLink();});
}
$("#traceSearch").oninput=e=>{S.traceQ=e.target.value;renderTraces();};

/* ---------- right: lineage tree (SVG, pan/zoom) ---------- */
const T={x:0,y:0,k:1};
function layoutTree(){
  const tree=S.tree; if(!tree) return null;
  const nodes=tree.nodes, byId={}; nodes.forEach(n=>byId[n.candidate_id]=n);
  const kids=c=>tree.children[c]||[];
  const NW=236,NH=92,GAPX=26,GAPY=34;
  let leafY=0; const pos={};
  function place(c,depth){
    const ch=kids(c).filter(k=>byId[k]);
    if(!ch.length){pos[c]={y:depth*(NH+GAPY),x:leafY*(NW+GAPX)};leafY++;return;}
    ch.forEach(k=>place(k,depth+1));
    const xs=ch.map(k=>pos[k].x);
    pos[c]={y:depth*(NH+GAPY),x:(Math.min(...xs)+Math.max(...xs))/2};
  }
  place(tree.roots[0],0);
  // forest: remaining roots (orphans etc.)
  tree.roots.slice(1).forEach(r=>{ if(byId[r]){leafY++;place(r,0);} });
  return {pos,byId,kids,NW,NH};
}
function renderTree(){
  const svg=$("#treeSvg");
  if(!S.tree||!S.tree.nodes.length){svg.innerHTML=`<text x="20" y="40" fill="#8b949e">No candidates recorded yet — waiting for builder…</text>`;return;}
  const L=layoutTree(); if(!L) return;
  const w=Math.max(...Object.values(L.pos).map(p=>p.x))+L.NW+40;
  const h=Math.max(...Object.values(L.pos).map(p=>p.y))+L.NH+40;
  let edges="",bodies="";
  const seen=new Set();
  const edgeFor=c=>{
    const p=L.byId[c].parent_id;
    if(p&&L.pos[p]&&L.pos[c]&&!seen.has(c)){
      seen.add(c);
      const a=L.pos[p],b=L.pos[c],x1=a.x+L.NW/2,y1=a.y+L.NH,x2=b.x+L.NW/2,y2=b.y,my=(y1+y2)/2;
      const ch=L.byId[c].changes, lbl=ch?(ch.identical?"no change":[ch.changed.length?ch.changed.length+" changed":"",ch.added.length?"+"+ch.added.length:"",ch.removed.length?"−"+ch.removed.length:""].filter(Boolean).join(" · ")+" steps"):"";
      edges+=`<path class="gedge" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`+(lbl?`<text class="glabel" x="${(x1+x2)/2+8}" y="${my+4}">${esc(lbl)}</text>`:"");
    }
  };
  S.tree.nodes.forEach(n=>edgeFor(n.candidate_id));
  for(const c of Object.keys(L.pos)){
    const n=L.byId[c]||{candidate_id:c};
    const p=L.pos[c];
    const sel=S.sel.kind==="candidate"&&S.sel.id===c;
    const cls="gnode"+(sel?" sel":"")+(n.champion?" champ":"")+(n.valid===false?" invalid":"");
    const ne=(n.errors||[]).length, tst=n.test;
    const checks=n.valid===true?"✓ passes all checks":n.valid===false?`✗ ${ne} blocking error${ne===1?"":"s"}`:"? not validated";
    const tested=tst?(tst.complete?`${tst.passed}/${tst.total} customers passed`:`test incomplete (${tst.passed??0} passed)`):(n.deployed?"deployed, not scored":"not deployed");
    const frac=tst&&tst.total?tst.passed/tst.total:null;
    bodies+=`<g class="${cls}" data-cand="${esc(c)}" transform="translate(${p.x},${p.y})">
      <rect width="${L.NW}" height="${L.NH}" rx="6"/>
      <text x="10" y="19" class="ttl">${n.champion?"★ ":""}${esc(n.label||"Candidate")}</text>
      <text x="${L.NW-10}" y="19" class="sub" text-anchor="end">${esc((n.created_at||"").slice(11,19))}</text>
      <text x="10" y="37" class="sub">${n.steps!=null?n.steps+" steps · "+(n.tools??0)+" tools":"workflow not readable"}</text>

(function(){

    const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;

  svg.onmousedown=e=>{drag={x:e.clientX-T.x,y:e.clientY-T.y};svg.style.cursor="grabbing";};

    ${c.champion?`<span class="badge b-champ">★ CHAMPION</span>`:""}
    ${val?`<span class="badge ${val.data.valid?"b-ok":"b-bad"}">${val.data.valid?"valid":"invalid"}</span>`:`<span class="badge b-unk">validation unknown</span>`}
    ${val&&val.data.evidence_type?`<span class="badge">evidence: ${esc(val.data.evidence_type)}</span>`:""}
    ${c.score!=null?`<span class="score-pill">score ${c.score} ${esc(S.summary.evaluation_type||"")}</span>`:""}
  </div>
  ${kvTable([["created",c.created_at],["parent",c.parent_candidate_id],
    ["lineage",c.recorded_lineage?"recorded":"derived"],
    ["workflow sha",(wf?wf.sha256:"").slice(0,24)]])}
  <div class="tabs">
    <button class="act" data-t="origin">Origin</button>
    ${c.parent_candidate_id?`<button data-t="diff">Changes</button>`:""}
    <button data-t="validation">Validation</button>
    <button data-t="workflow">Workflow</button>
    <button data-t="raw">Raw</button>
  </div>
  <div id="ctab"></div>`;
  const show=async t=>{
    S.ctab=t;
    el.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("act",b.dataset.t===t));
    const host=$("#ctab");
    if(t==="origin"){
      host.innerHTML=`<h3 class="sec">How this candidate was created</h3>`+
        (prop?`<pre class="code">${esc(JSON.stringify({coverage:prop.data.coverage,architecture:prop.data.architecture,tool_gates:prop.data.tool_gates},null,1))}</pre>`
             :`<div class="meta">proposal: not captured</div>`)+
        (c.parent_candidate_id?`<div class="meta" style="margin-top:8px">parent ${esc(c.parent_candidate_id)} → this candidate${c.recorded_lineage?"":" (lineage derived from snapshots; mutation details not recorded)"}</div>`
             :`<div class="meta">root candidate (ADAS baseline)</div>`);
    }else if(t==="diff"){
      host.innerHTML=`<div class="empty">loading diff…</div>`;
      const r=await api(`runs/${S.runId}/candidates/${encodeURIComponent(c.candidate_id)}/diff`);
      if(!r.body.changes){host.innerHTML=`<div class="warnbox">${esc(r.body.note||r.body.error||"no diff")}</div>`;return;}
      const d=r.body;
      host.innerHTML=changesHtml(d,c);
      host.querySelectorAll("a[data-cand]").forEach(a=>a.onclick=()=>{S.sel={kind:"candidate",id:a.dataset.cand};renderTree();renderInspector();pushLink();});
    }else if(t==="validation"){
      host.innerHTML=val?`<pre class="code">${esc(JSON.stringify(val.data,null,1))}</pre>`
        :`<div class="meta">validation: not captured</div>`;
    }else if(t==="workflow"){
      if(!wf){host.innerHTML=`<div class="meta">workflow snapshot: not captured</div>`;}
      else{
        let delta=null;
        if(c.parent_candidate_id){const r=await api(`runs/${S.runId}/candidates/${encodeURIComponent(c.candidate_id)}/diff`); if(r.body&&r.body.changes) delta=nodeDelta(r.body);}
        renderWorkflowGraph(host,wf.data,val?val.data:null,delta);
      }
    }else{
      host.innerHTML=`<pre class="code">${esc(JSON.stringify(c,null,1))}</pre>`;
    }
  };
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.t));
  const has=t=>!!el.querySelector(`.tabs button[data-t="${t}"]`);
  show(S.ctab&&has(S.ctab)?S.ctab:"origin");
}

/* ---------- workflow graph: steps as nodes, routes as edges ---------- */
const WF_COLORS={conversation:"#58a6ff",api_request:"#d29922",code:"#b392f0",end_call:"#f85149"};
const WFV={x:0,y:0,k:1};
function condText(c){
  if(!c||typeof c!=="object") return "?";
  if(c.logic) return (c.conditions||[]).map(x=>x&&x.logic?"("+condText(x)+")":condText(x)).join(c.logic==="and"?" AND ":" OR ");
  if(c.operator==="always") return "always";
  if(c.operator==="matches_intent") return "intent: "+(c.description||"");
  const op={equals:"=",not_equals:"≠",greater_than:">",less_than:"<",contains:"contains",is_set:"is set",is_not_set:"is not set"}[c.operator]||c.operator;
  return (c.variable||"?")+" "+op+("operand" in c?" "+c.operand:"");
}
function wfTools(n){
  return [...(n.tools||[]),...(n.pre_actions||[])].filter(x=>x&&typeof x==="object").map(x=>{
    const f=(x.function&&typeof x.function==="object")?x.function:{};
    return {name:x.bank_operation||f.name||"tool",code:f.handler==="__function__:code_exec",desc:x.description||f.description||"",
            src:f.parameters?.properties?.code?.default,body:f.parameters?.properties?.body?.properties,
            mapping:x.response_mapping,pre:x.pre_process_code,post:x.post_process_code};
  });
}
function wfModel(wf){
  const nodes={...(wf.nodes||{}),...(wf.global_nodes||{})}, edges=[];
  for(const [k,n] of Object.entries(nodes)){
    if(!n||typeof n!=="object") continue;
    (Array.isArray(n.transitions)?n.transitions:[]).forEach(tr=>{
      if(tr&&nodes[tr.target_node]) edges.push({from:k,to:tr.target_node,label:condText(tr.condition),desc:tr.description||"",fb:false});});
    [["max_turn_transition","turn limit"],["passthrough_default_transition","default"]].forEach(([f,l])=>{
      if(n[f]&&nodes[n[f]]) edges.push({from:k,to:n[f],label:l,desc:"",fb:true});});
  }
  // layer = shortest distance from the first step; anything unreachable goes in a last column
  const depth={}; let q=wf.initial_node&&nodes[wf.initial_node]?[wf.initial_node]:[];
  q.forEach(k=>depth[k]=0);
  while(q.length){const k=q.shift(); edges.filter(e=>e.from===k&&depth[e.to]==null).forEach(e=>{depth[e.to]=depth[k]+1;q.push(e.to);});}
  const maxD=Math.max(0,...Object.values(depth));
  const unreachable=Object.keys(nodes).filter(k=>depth[k]==null);
  unreachable.forEach(k=>depth[k]=maxD+1);
  // end steps read best in one final column
  const lastCol=Math.max(...Object.values(depth));
  Object.keys(nodes).forEach(k=>{if(nodes[k]?.node_type==="end_call"&&!unreachable.includes(k)) depth[k]=Math.max(depth[k],maxD);});
  const layers=[]; Object.keys(nodes).forEach(k=>{(layers[depth[k]]=layers[depth[k]]||[]).push(k);});
  for(let i=0;i<=lastCol;i++) layers[i]=layers[i]||[];
  // order each column by the average row of its predecessors to cut crossings
  const row={}; layers[0].forEach((k,i)=>row[k]=i);
  for(let d=1;d<layers.length;d++){
    const score=k=>{const ps=edges.filter(e=>e.to===k&&depth[e.from]<d).map(e=>row[e.from]).filter(v=>v!=null);
      return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:1e6;};
    layers[d].sort((a,b)=>score(a)-score(b)); layers[d].forEach((k,i)=>row[k]=i);
  }
  return {nodes,edges,depth,layers,row,unreachable:new Set(unreachable),initial:wf.initial_node};
}
function nodeDelta(d){ // which steps a candidate added / changed / removed compared with its parent
  const out={added:new Set(),changed:new Set(),removed:[]};
  (d.changes||[]).forEach(ch=>{const m=/^\/(?:nodes|global_nodes)\/([^\/\[]+)(.*)$/.exec(ch.path||""); if(!m) return;
    if(!m[2]){ if(ch.op==="added") out.added.add(m[1]); else if(ch.op==="removed") out.removed.push(m[1]); else out.changed.add(m[1]); }
    else out.changed.add(m[1]);});
  out.added.forEach(k=>out.changed.delete(k)); return out;
}
function changesHtml(d,c){
  const groups={}, top=[];
  (d.changes||[]).forEach(ch=>{const m=/^\/(?:nodes|global_nodes)\/([^\/\[]+)(.*)$/.exec(ch.path||""); if(m) (groups[m[1]]=groups[m[1]]||[]).push({...ch,rel:m[2]||"(whole step)"}); else top.push({...ch,rel:ch.path});});
  const val=x=>x==null?`<span class="meta">—</span>`:`<pre class="code" style="max-height:200px;margin:0">${esc(typeof x==="string"?x:JSON.stringify(x,null,1))}</pre>`;
  const block=(name,list)=>`<div class="ncard"><h4>${esc(name)} <span class="badge">${list.length} change${list.length===1?"":"s"}</span></h4>
    <table>${list.map(ch=>`<tr><td style="width:26%"><span class="badge ${ch.op==="added"?"b-ok":ch.op==="removed"?"b-bad":"b-warn"}">${esc(ch.op)}</span><div class="mono" style="font-size:11px;word-break:break-all">${esc(ch.rel.replace(/^\//,"").replace(/\//g," › "))}</div></td>
      <td style="width:37%"><div class="meta">before</div>${val(ch.before)}</td><td><div class="meta">after</div>${val(ch.after)}</td></tr>`).join("")}</table></div>`;
  const names=Object.keys(groups);
  return `<div class="meta" style="white-space:normal">Compared with <a data-cand="${esc(d.parent_candidate_id)}" style="color:var(--accent);cursor:pointer" class="mono">${esc(d.parent_candidate_id)}</a>${c.parent_derived?" — the candidate this repair rewrote":""}.
      ${d.identical?"The workflows are identical.":`${names.length} step${names.length===1?"":"s"} touched, ${d.changes.length} field changes. The Workflow tab outlines them on the graph.`}</div>
    ${names.map(n=>block(n,groups[n])).join("")}${top.length?block("workflow settings",top):""}`;
}
function renderWorkflowGraph(host,wf,validation,delta){
  const M=wfModel(wf), NW=178,NH=46,GX=92,GY=20;
  const tall=Math.max(...M.layers.map(l=>l.length),1);
  const pos={}; M.layers.forEach((l,d)=>{const off=(tall-l.length)*(NH+GY)/2; l.forEach((k,i)=>pos[k]={x:d*(NW+GX),y:off+i*(NH+GY)});});
  const flagged=new Set(); const notes=[...(validation?.errors||[]),...(validation?.warnings||[])];
  notes.forEach(e=>{const m=/^([a-z][a-z0-9_]*)[:\/]/.exec(e); if(m&&M.nodes[m[1]]) flagged.add(m[1]);
    (e.match(/'([a-z][a-z0-9_]*)'/g)||[]).forEach(q=>{const k=q.slice(1,-1); if(/^Unreachable/.test(e)&&M.nodes[k]) flagged.add(k);});});
  const counts={}; Object.values(M.nodes).forEach(n=>{counts[n?.node_type]=(counts[n?.node_type]||0)+1;});
  const short=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
  let edgesSvg="",labels="",nodesSvg="";
  M.edges.forEach((e,i)=>{
    if(e.from===e.to) return;
    const a=pos[e.from],b=pos[e.to]; let d;
    if(b.x>a.x){const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,mx=(x1+x2)/2; d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;}
    else{const x1=a.x+NW/2,y1=a.y,x2=b.x+NW/2,y2=b.y, lift=Math.min(a.y,b.y)-26-(i%5)*7; d=`M${x1},${y1} C${x1},${lift} ${x2},${lift} ${x2},${y2}`;}
    edgesSvg+=`<path class="we ${e.fb?"fb":""} ${b.x>a.x?"":"back"}" data-f="${esc(e.from)}" data-t="${esc(e.to)}" d="${d}" marker-end="url(#wfarr)"><title>${esc(e.from+" → "+e.to+"\n"+e.label+(e.desc?"\n"+e.desc:""))}</title></path>`;
    const lx=b.x>a.x?(a.x+NW+b.x)/2:(a.x+b.x+NW)/2, ly=b.x>a.x?(a.y+b.y+NH)/2-3:Math.min(a.y,b.y)-22-(i%5)*7;
    labels+=`<text class="wl" data-f="${esc(e.from)}" data-t="${esc(e.to)}" x="${lx}" y="${ly}" text-anchor="middle" style="display:none">${esc(short(e.label,46))}</text>`;
  });
  for(const [k,n] of Object.entries(M.nodes)){
    const p=pos[k], type=n?.node_type||"?", col=WF_COLORS[type]||"#6e7681", tools=n&&typeof n==="object"?wfTools(n):[];
    const loops=M.edges.some(e=>e.from===k&&e.to===k);
    const sub=tools.length?tools.map(x=>x.code?"code":x.name).join(", "):type.replace("_"," ");
    const dcls=delta?(delta.added.has(k)?" dadd":delta.changed.has(k)?" dchg":""):"";
    nodesSvg+=`<g class="wn ${flagged.has(k)?"flag":""}${dcls}" data-k="${esc(k)}" transform="translate(${p.x},${p.y})">
      <rect width="${NW}" height="${NH}" rx="6" stroke="${col}"></rect><rect width="5" height="${NH}" rx="2" fill="${col}" stroke="none" style="fill:${col}"></rect>
      <text x="13" y="19">${k===M.initial?"▶ ":""}${esc(short(k,23))}${loops?" ↻":""}</text>
      <text class="sub" x="13" y="35">${esc(short(sub,30))}</text><title>${esc(k+" ("+type+")")}</title></g>`;
  }
  host.innerHTML=`<div class="wfbar">
      <button class="ctl" id="wfFit">Fit</button><button class="ctl" id="wfLabels">Route labels</button><button class="ctl" id="wfJson">JSON</button>
      ${Object.entries(WF_COLORS).map(([t,c])=>`<span class="lg"><span class="sw" style="background:${c}"></span>${t.replace("_"," ")} ${counts[t]||0}</span>`).join("")}
      <span class="lg">┄ fallback route</span>${delta&&(delta.added.size||delta.changed.size||delta.removed.length)?`<span class="badge b-warn">vs parent: ${delta.changed.size} changed${delta.added.size?", "+delta.added.size+" new":""}${delta.removed.length?", "+delta.removed.length+" removed ("+esc(delta.removed.join(", "))+")":""}</span>`:delta?`<span class="badge">identical to parent</span>`:""}${M.unreachable.size?`<span class="badge b-bad">${M.unreachable.size} unreachable</span>`:""}${flagged.size?`<span class="badge b-bad">${flagged.size} flagged by validation</span>`:""}
    </div>
    <div id="wfwrap"><svg id="wfSvg"><defs><marker id="wfarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#768390"/></marker></defs>
      <g id="wfView">${edgesSvg}${nodesSvg}${labels}</g></svg></div>
    <div class="meta" style="margin-top:4px">${Object.keys(M.nodes).length} steps · ${M.edges.length} routes · drag to pan, scroll to zoom, click a step for its prompt, tools and routes</div>
    <div id="wfDetail"></div><pre class="code" id="wfRaw" style="display:none"></pre>`;
  const svg=host.querySelector("#wfSvg"), view=host.querySelector("#wfView");
  const apply=()=>view.setAttribute("transform",`translate(${WFV.x},${WFV.y}) scale(${WFV.k})`);
  const fit=()=>{const bb=view.getBBox(),r=svg.getBoundingClientRect(); if(!bb.width||!r.width) return;
    WFV.k=Math.min(r.width/(bb.width+40),r.height/(bb.height+40),1.2); WFV.x=(r.width-bb.width*WFV.k)/2-bb.x*WFV.k; WFV.y=(r.height-bb.height*WFV.k)/2-bb.y*WFV.k; apply();};
  let drag=null, moved=false, showAll=false, sel=null;
  svg.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12,r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    WFV.x=mx-(mx-WFV.x)*f;WFV.y=my-(my-WFV.y)*f;WFV.k=Math.min(Math.max(WFV.k*f,.05),3);apply();};
  svg.onmousedown=e=>{drag={x:e.clientX-WFV.x,y:e.clientY-WFV.y};moved=false;};
  svg.onmousemove=e=>{if(drag){moved=true;WFV.x=e.clientX-drag.x;WFV.y=e.clientY-drag.y;apply();}};
  svg.onmouseup=svg.onmouseleave=()=>{drag=null;};
  const paint=()=>{
    const near=new Set(sel?[sel]:[]); if(sel) M.edges.forEach(e=>{if(e.from===sel)near.add(e.to); if(e.to===sel)near.add(e.from);});
    host.querySelectorAll(".wn").forEach(g=>{g.classList.toggle("sel",g.dataset.k===sel);g.classList.toggle("dimmed",!!sel&&!near.has(g.dataset.k));});
    host.querySelectorAll(".we").forEach(pth=>{const hot=sel&&(pth.dataset.f===sel||pth.dataset.t===sel);pth.classList.toggle("hot",!!hot);pth.classList.toggle("dimmed",!!sel&&!hot);});
    host.querySelectorAll(".wl").forEach(l=>{l.style.display=(showAll&&!sel)||(sel&&l.dataset.f===sel)?"":"none";});
  };
  const pick=k=>{sel=sel===k?null:k; paint(); renderWorkflowNode(host.querySelector("#wfDetail"),sel,M,notes,pick);};
  host.querySelectorAll(".wn").forEach(g=>g.onclick=()=>{if(!moved) pick(g.dataset.k);});
  host.querySelector("#wfFit").onclick=fit;
  host.querySelector("#wfLabels").onclick=()=>{showAll=!showAll;paint();};
  host.querySelector("#wfJson").onclick=()=>{const raw=host.querySelector("#wfRaw"); const on=raw.style.display==="none";
    if(on&&!raw.textContent) raw.textContent=JSON.stringify(wf,null,1); raw.style.display=on?"":"none";};
  fit(); renderWorkflowNode(host.querySelector("#wfDetail"),null,M,notes,pick);
}
function renderWorkflowNode(el,k,M,notes,pick){
  if(!k){el.innerHTML="";return;}
  const n=M.nodes[k]||{}, tools=wfTools(n), out=M.edges.filter(e=>e.from===k), inc=M.edges.filter(e=>e.to===k&&e.from!==k);
  const mine=notes.filter(e=>e.startsWith(k+":")||e.startsWith(k+"/")||e.includes("'"+k+"'"));
  const term=n.terminal?.function?.parameters?.properties||{};
  const link=x=>`<a data-go="${esc(x)}">${esc(x)}</a>`;
  el.innerHTML=`<div class="ncard"><h4><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${WF_COLORS[n.node_type]||"#6e7681"}"></span> ${esc(k)} <span class="badge">${esc(n.node_type||"?")}</span>
      ${k===M.initial?`<span class="badge b-ok">first step</span>`:""}${M.unreachable.has(k)?`<span class="badge b-bad">unreachable</span>`:""}${n.max_node_turns?`<span class="badge">max ${esc(n.max_node_turns)} turns</span>`:""}</h4>
    ${mine.map(e=>`<div class="errbox">${esc(e)}</div>`).join("")}
    ${n.on_enter?.text?`<div class="lbl">Says on entry</div><div class="say">${esc(n.on_enter.text)}</div>`:""}
    ${term.spoken_message?.default?`<div class="lbl">Says before hanging up</div><div class="say">${esc(term.spoken_message.default)}</div>`:""}
    ${n.task_message?`<div class="lbl">Instruction to the phone model</div><div class="say">${esc(n.task_message)}</div>`:""}
    ${tools.length?`<div class="lbl">${n.node_type==="conversation"?"Tools the model may call":"Runs automatically"}</div>`+tools.map(x=>`<div style="margin-bottom:6px"><span class="chip">${esc(x.code?"python":x.name)}</span>${esc(x.desc)}
        ${x.body?`<div class="meta" style="white-space:normal">arguments: ${Object.entries(x.body).map(([a,s])=>`<span class="chip">${esc(a)}${s&&s.default!=null?" = "+esc(s.default):""}</span>`).join("")}</div>`:""}
        ${x.mapping?.length?`<div class="meta" style="white-space:normal">saves: ${x.mapping.map(m=>`<span class="chip">${esc(m.variable)} ← ${esc(m.path)}</span>`).join("")}</div>`:""}
        ${x.src?`<pre class="code" style="max-height:260px">${esc(x.src)}</pre>`:""}
        ${x.pre?`<div class="meta">before the call</div><pre class="code" style="max-height:180px">${esc(x.pre)}</pre>`:""}
        ${x.post?`<div class="meta">after the call</div><pre class="code" style="max-height:180px">${esc(x.post)}</pre>`:""}</div>`).join(""):""}
    ${(n.response_mapping||[]).length?`<div class="lbl">Saves from the response</div>${n.response_mapping.map(m=>`<span class="chip">${esc(m.variable)} ← ${esc(m.path)}</span>`).join("")}`:""}
    ${(n.extraction_schema||[]).length?`<div class="lbl">Extracts from what the customer says</div><table>${n.extraction_schema.map(x=>`<tr><td><span class="chip">${esc(x.name)}</span></td><td>${esc(x.description||"")}${x.enum?` <span class="meta">[${esc(x.enum.join(", "))}]</span>`:""}</td></tr>`).join("")}</table>`:""}
    <div class="lbl">Routes out (checked in this order)</div>
    ${out.length?`<table>${out.map((e,i)=>`<tr><td>${i+1}</td><td>${e.to===k?"↻ stay here":"→ "+link(e.to)}</td><td class="mono">${esc(e.label)}${e.fb?" <span class='meta'>(fallback)</span>":""}</td><td class="meta" style="white-space:normal">${esc(e.desc)}</td></tr>`).join("")}</table>`:`<div class="meta">none — the call ends here</div>`}
    <div class="lbl">Reached from</div>
    ${inc.length?[...new Set(inc.map(e=>e.from))].map(link).join(" · "):`<span class="meta">${k===M.initial?"call start":"nothing routes here"}</span>`}
  </div>`;
  el.querySelectorAll("a[data-go]").forEach(a=>a.onclick=()=>{pick(a.dataset.go);});
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") {if(e.key==="Escape") e.target.blur(); return;}
  if(e.key==="/"){e.preventDefault();$("#traceSearch").focus();}
  else if(e.key==="Escape"){S.sel={kind:"run"};renderTraces();renderTree();renderInspector();pushLink();}
  else if(e.key==="f"||e.key==="F") fitTree();
  else if(e.key==="l"||e.key==="L") $("#live").onclick();
});

/* ---------- boot ---------- */
$("#runPicker").onchange=e=>selectRun(e.target.value);
(async function(){
  await loadRuns();
  const link=parseLink();
  if(link&&S.runs.some(r=>r.run_id===link.runId)){
    selectRun(link.runId,link.sel);
  }else if(link){
    $("#inspector").innerHTML=`<div class="warnbox">Run "${esc(link.runId)}" not found in ${esc(S.runs.length)} archived runs. Pick one from the selector.</div>`;
    if(S.runs[0]) selectRun(S.runs[0].run_id);
  }else if(S.runs.length){
    selectRun(S.runs[0].run_id);   // most recently active
  }else{
    $("#inspector").innerHTML=`<div class="empty">No runs found under artifacts dir.<br>Generate a demo: <span class="mono">python -m observability.demo --out agent/artifacts/demo_run</span></div>`;
    $("#traceList").innerHTML=`<div class="empty">No runs</div>`;
  }
})();
